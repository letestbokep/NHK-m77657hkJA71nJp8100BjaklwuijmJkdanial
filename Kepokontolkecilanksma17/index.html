<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Koleksi Kontol Khas</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
        body {
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        img {
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .fade-enter { opacity: 0; transition: opacity 0.55s ease-in-out; }
        .fade-enter-active { opacity: 1; }
        .progress-bar-fill { transition: width 0.1s linear; }
        .thumb-preview {
            transition: transform 0.2s ease, opacity 0.3s ease, box-shadow 0.2s ease;
            -webkit-user-drag: none;
            cursor: pointer;
        }
        .thumb-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.6);
            z-index: 10;
        }
        .thumbs-scroll { scrollbar-width: thin; }
        .thumbs-scroll::-webkit-scrollbar { height: 5px; }
        .thumbs-scroll::-webkit-scrollbar-track { background: transparent; }
        .thumbs-scroll::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.45);
            border-radius: 4px;
        }
        .side-thumbs { scrollbar-width: none; }
        .side-thumbs::-webkit-scrollbar { display: none; }

        .gallery-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: clamp(6px, 1vw, 12px);
        }
        .page8-gif-row {
            width: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: clamp(5px, 0.8vw, 10px);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            padding: 2px;
        }
        .page8-gif-row::-webkit-scrollbar { display: none; }
        .page8-gif-row img {
            width: clamp(42px, 6vw, 82px);
            height: clamp(42px, 6vw, 82px);
            min-width: clamp(42px, 6vw, 82px);
            object-fit: cover;
            border-radius: clamp(7px, 1vw, 11px);
            border: 1px solid rgba(148, 163, 184, 0.38);
            background: #020617;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.34);
            -webkit-user-drag: none;
            cursor: pointer;
        }
        .page8-gif-row.gif-visible {
            display: flex;
            animation: gifRowAppear 0.3s ease-out;
        }
        @keyframes gifRowAppear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-and-side {
            width: 100%;
            display: flex;
            align-items: stretch;
            gap: clamp(6px, 1vw, 12px);
        }
        .main-image-wrap {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            aspect-ratio: 4 / 3;
            background: #000;
            overflow: hidden;
            border-radius: clamp(9px, 1.3vw, 16px);
            cursor: pointer;
        }
        .main-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .side-preview {
            flex: 0 0 clamp(48px, 8vw, 92px);
            min-width: clamp(48px, 8vw, 92px);
            max-height: min(400px, 48vw);
            overflow-y: auto;
        }
        @media (max-width: 767px) {
            .main-and-side { display: block; }
            .side-preview { display: none !important; }
            .mobile-bottom-thumbs { display: flex; }
        }
        @media (min-width: 768px) {
            .mobile-bottom-thumbs { display: none; }
        }
        @media (min-width: 1280px) {
            .page8-gif-row img { width: 82px; height: 82px; min-width: 82px; }
        }
        @media (min-width: 1536px) {
            .page8-gif-row img { width: 90px; height: 90px; min-width: 90px; }
        }
        @media (max-width: 390px) {
            .page8-gif-row { justify-content: flex-start; }
            .page8-gif-row img { width: 42px; height: 42px; min-width: 42px; }
        }
        .protected-media {
            -webkit-user-drag: none !important;
            user-drag: none !important;
            -webkit-touch-callout: none !important;
        }
        .media-protection-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: transparent;
            pointer-events: none;
        }
        #admin-modal, #admin-modal * {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>

<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

<main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 lg:p-8 w-full">
    <div class="w-full max-w-md sm:max-w-xl md:max-w-3xl lg:max-w-5xl xl:max-w-6xl bg-slate-800/80 rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden backdrop-blur-md">

        <div class="p-3 sm:p-4 md:p-5 text-center border-b border-slate-700/50">
            <h1 id="gallery-title" class="text-base sm:text-lg md:text-xl lg:text-2xl font-bold tracking-wide text-slate-100">
                Gambar bogel danial
            </h1>
            <p class="text-[10px] sm:text-xs text-slate-400 mt-1">
                Sila tunggu sebentar, gambar sedang dimuatkan...
            </p>
        </div>

        <div class="p-2 sm:p-3 md:p-4 lg:p-5 bg-slate-900/40">
            <div class="gallery-stage">
                <div id="page8-gifs-top" class="page8-gif-row"></div>

                <div class="main-and-side">
                    <div id="left-thumbs" class="side-thumbs side-preview flex flex-col gap-1.5 sm:gap-2"></div>

                    <div class="main-image-wrap" id="main-image-click">
                        <img id="slideshow-image" src="" alt="Promosi" class="fade-enter fade-enter-active protected-media">
                        <div class="media-protection-layer"></div>
                        <div class="absolute top-2 right-2 sm:top-3 sm:right-3 bg-black/60 text-white text-[10px] sm:text-xs px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full backdrop-blur-md border border-white/10 z-10">
                            <span id="current-slide-num">1</span> / <span id="total-slides-num">1</span>
                        </div>
                    </div>

                    <div id="right-thumbs" class="side-thumbs side-preview flex flex-col gap-1.5 sm:gap-2"></div>
                </div>

                <div id="mobile-bottom-thumbs" class="mobile-bottom-thumbs thumbs-scroll gap-1.5 overflow-x-auto py-1"></div>
                <div id="page8-gifs-bottom" class="page8-gif-row"></div>
            </div>
        </div>

        <div class="px-2 sm:px-3 md:px-4 pb-2 sm:pb-3">
            <div id="bottom-thumbs" class="thumbs-scroll flex gap-1.5 sm:gap-2 overflow-x-auto py-1"></div>
        </div>

        <div class="p-3 sm:p-4 md:p-5 space-y-2 sm:space-y-3 border-t border-slate-700/40">
            <div class="w-full bg-slate-700/60 h-1.5 sm:h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-full w-0 progress-bar-fill"></div>
            </div>
            <div class="flex justify-between items-center text-[11px] sm:text-xs text-slate-400">
                <span>Masa Tinggal: <strong id="countdown-text" class="text-slate-200">0s</strong></span>
                <span class="animate-pulse text-indigo-400">Memproses...</span>
            </div>
        </div>
    </div>
</main>

<footer class="py-2 sm:py-3 text-center text-[10px] sm:text-xs text-slate-500">
    &copy; <span id="year"></span> kontol danial
</footer>

<div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-5 sm:p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
            <h2 class="text-lg font-bold text-indigo-400">⚙️ Borang Tetapan (Admin)</h2>
            <button id="close-admin-btn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
        </div>

        <form id="config-form" class="space-y-4 text-sm">
            <div>
                <label class="block font-medium text-slate-200 mb-1">Pautan Default (kalau gambar tak ada link sendiri):</label>
                <input type="url" id="input-target-url" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block font-medium text-slate-200 mb-1">
                    Gambar Slideshow (1 baris = 1 gambar)<br>
                    <span class="text-xs text-slate-400">Format: nama-gambar.jpeg|https://link-shopee</span>
                </label>
                <textarea id="input-images" rows="5" required
                          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          placeholder="IMG_2080.jpeg|https://s.shopee.com.my/xxxx"></textarea>
            </div>

            <div>
                <label class="block font-medium text-slate-200 mb-1">
                    Gambar Preview Kiri/Kanan/Bawah<br>
                    <span class="text-xs text-slate-400">Format sama: nama.jpeg|https://link</span>
                </label>
                <textarea id="input-preview-images" rows="5"
                          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block font-medium text-slate-200 mb-1">
                    🎞️ GIF Page 8<br>
                    <span class="text-xs text-slate-400">Format sama: nama.gif|https://link</span>
                </label>
                <textarea id="input-page8-gifs" rows="6"
                          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Masa Sedia (Saat):</label>
                    <input type="number" id="input-slide-duration" min="1" max="30" value="3" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Tajuk Halaman:</label>
                    <input type="text" id="input-page-title" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg text-white">Simpan</button>
                <button type="button" id="reset-default-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-lg text-slate-300">Reset</button>
            </div>
        </form>
    </div>
</div>

        ]
    };

    function parseLine(line, defaultUrl) {
        const parts = line.split('|').map(s => s.trim()).filter(Boolean);
        if (!parts.length) return null;
        return {
            src: parts[0],
            url: parts[1] || defaultUrl
        };
    }

    function linesToObjects(text, defaultUrl) {
        return text.split('\n')
            .map(l => parseLine(l, defaultUrl))
            .filter(Boolean);
    }

    function objectsToLines(arr) {
        return (arr || []).map(item => {
            if (typeof item === 'string') return item;
            return item.url && item.url !== DEFAULT_CONFIG.targetUrl
                ? `${item.src}|${item.url}`
                : item.src;
        }).join('\n');
    }

    function loadConfig() {
        const saved = localStorage.getItem('site_config');
        if (!saved) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));

        try {
            const parsed = JSON.parse(saved);

            // Support old format (string array) → convert
            const convert = (arr, defaultUrl) => {
                if (!Array.isArray(arr)) return [];
                return arr.map(item => {
                    if (typeof item === 'string') return { src: item, url: defaultUrl };
                    return item;
                });
            };

            const defaultUrl = parsed.targetUrl || DEFAULT_CONFIG.targetUrl;

            return {
                targetUrl: defaultUrl,
                pageTitle: parsed.pageTitle || DEFAULT_CONFIG.pageTitle,
                slideDuration: parsed.slideDuration || 3,
                images: convert(parsed.images, defaultUrl),
                previewImages: convert(parsed.previewImages, defaultUrl),
                page8Gifs: convert(parsed.page8Gifs, defaultUrl)
            };
        } catch (e) {
            return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        }
    }

    let config = loadConfig();

    const imgElement = document.getElementById('slideshow-image');
    const currentSlideNum = document.getElementById('current-slide-num');
    const totalSlidesNum = document.getElementById('total-slides-num');
    const progressBar = document.getElementById('progress-bar');
    const countdownText = document.getElementById('countdown-text');
    const galleryTitle = document.getElementById('gallery-title');
    const leftThumbs = document.getElementById('left-thumbs');
    const rightThumbs = document.getElementById('right-thumbs');
    const bottomThumbs = document.getElementById('bottom-thumbs');
    const mobileBottomThumbs = document.getElementById('mobile-bottom-thumbs');
    const page8GifsTop = document.getElementById('page8-gifs-top');
    const page8GifsBottom = document.getElementById('page8-gifs-bottom');
    const adminModal = document.getElementById('admin-modal');
    const configForm = document.getElementById('config-form');
    const inputTargetUrl = document.getElementById('input-target-url');
    const inputImages = document.getElementById('input-images');
    const inputPreviewImages = document.getElementById('input-preview-images');
    const inputPage8Gifs = document.getElementById('input-page8-gifs');
    const inputSlideDuration = document.getElementById('input-slide-duration');
    const inputPageTitle = document.getElementById('input-page-title');
    const closeAdminBtn = document.getElementById('close-admin-btn');
    const resetDefaultBtn = document.getElementById('reset-default-btn');
    const mainImageClick = document.getElementById('main-image-click');

    let currentSlideIndex = 0;
    let totalSlides = config.images.length;
    let totalDuration = totalSlides * config.slideDuration;
    let progressTimer = null;
    let currentMainUrl = config.targetUrl;

    const SIDE_COUNT = 5;
    const BOTTOM_COUNT = 30;

    function goToLink(url) {
        window.location.href = url || config.targetUrl;
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function protectImage(img) {
        img.classList.add('protected-media');
        img.draggable = false;
        img.addEventListener('dragstart', e => e.preventDefault());
        img.addEventListener('contextmenu', e => e.preventDefault());
        img.addEventListener('selectstart', e => e.preventDefault());
    }

    function createThumbElement(item, sizeClass) {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = 'Preview';
        img.loading = 'lazy';
        img.draggable = false;
        img.className = `thumb-preview ${sizeClass} object-cover rounded-md border border-slate-600/60 bg-slate-900 opacity-90 hover:opacity-100 protected-media`;
        img.onerror = function() { this.style.display = 'none'; };
        protectImage(img);
        img.addEventListener('click', () => goToLink(item.url));
        return img;
    }

    function renderPreviews() {
        leftThumbs.innerHTML = '';
        rightThumbs.innerHTML = '';
        bottomThumbs.innerHTML = '';
        mobileBottomThumbs.innerHTML = '';

        let pool = Array.isArray(config.previewImages) ? [...config.previewImages] : [];
        if (!pool.length) return;

        pool = shuffleArray(pool);

        while (pool.length < SIDE_COUNT * 2 + BOTTOM_COUNT) {
            pool = pool.concat(shuffleArray(config.previewImages));
        }

        const sideClass = 'w-full aspect-square';
        for (let i = 0; i < SIDE_COUNT; i++) {
            leftThumbs.appendChild(createThumbElement(pool[i], sideClass));
        }
        for (let i = 0; i < SIDE_COUNT; i++) {
            rightThumbs.appendChild(createThumbElement(pool[SIDE_COUNT + i], sideClass));
        }

        const bottomClass = 'w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 shrink-0';
        for (let i = 0; i < BOTTOM_COUNT; i++) {
            const item = pool[SIDE_COUNT * 2 + i];
            bottomThumbs.appendChild(createThumbElement(item, bottomClass));
            mobileBottomThumbs.appendChild(createThumbElement(item, bottomClass));
        }
    }

    function createGifElement(item) {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = 'GIF';
        img.loading = 'lazy';
        img.draggable = false;
        img.className = 'protected-media';
        img.onerror = function() { this.style.display = 'none'; };
        protectImage(img);
        img.addEventListener('click', () => goToLink(item.url));
        return img;
    }

    function renderPage8Gifs() {
        page8GifsTop.innerHTML = '';
        page8GifsBottom.innerHTML = '';
        page8GifsTop.classList.remove('gif-visible');
        page8GifsBottom.classList.remove('gif-visible');

        if (currentSlideIndex !== 7) return;

        const gifs = Array.isArray(config.page8Gifs) ? [...config.page8Gifs] : [];
        if (!gifs.length) return;

        const half = Math.ceil(gifs.length / 2);
        gifs.slice(0, half).forEach(item => page8GifsTop.appendChild(createGifElement(item)));
        gifs.slice(half).forEach(item => page8GifsBottom.appendChild(createGifElement(item)));

        page8GifsTop.classList.add('gif-visible');
        page8GifsBottom.classList.add('gif-visible');
    }

    function initPublicPage() {
        galleryTitle.textContent = config.pageTitle;
        totalSlides = config.images.length;
        totalSlidesNum.textContent = totalSlides;
        currentSlideIndex = 0;
        totalDuration = totalSlides * config.slideDuration;
        progressBar.style.width = '0%';

        if (totalSlides > 0) {
            imgElement.src = config.images[0].src;
            currentMainUrl = config.images[0].url;
            currentSlideNum.textContent = '1';
        }

        renderPreviews();
        renderPage8Gifs();
        startSlideshowAndRedirect();
    }

    function changeSlide(index) {
        imgElement.classList.remove('fade-enter-active');
        setTimeout(() => {
            const item = config.images[index];
            imgElement.src = item.src;
            currentMainUrl = item.url;
            currentSlideNum.textContent = index + 1;
            currentSlideIndex = index;
            renderPage8Gifs();
            imgElement.classList.add('fade-enter-active');
        }, 120);
    }

    function startSlideshowAndRedirect() {
        clearInterval(progressTimer);
        const startTime = Date.now();
        const totalMs = totalDuration * 1000;

        progressTimer = setInterval(() => {
            const elapsedMs = Date.now() - startTime;
            const remainingMs = Math.max(0, totalMs - elapsedMs);

            countdownText.textContent = `${Math.ceil(remainingMs / 1000)}s`;
            progressBar.style.width = `${Math.min(100, (elapsedMs / totalMs) * 100)}%`;

            const calculatedIndex = Math.min(
                totalSlides - 1,
                Math.floor(elapsedMs / (config.slideDuration * 1000))
            );

            if (calculatedIndex !== currentSlideIndex) {
                currentSlideIndex = calculatedIndex;
                changeSlide(currentSlideIndex);
            }

            if (remainingMs <= 0) {
                clearInterval(progressTimer);
                goToLink(currentMainUrl);
            }
        }, 100);
    }

    function openAdminModal() {
        inputTargetUrl.value = config.targetUrl || '';
        inputImages.value = objectsToLines(config.images);
        inputPreviewImages.value = objectsToLines(config.previewImages);
        inputPage8Gifs.value = objectsToLines(config.page8Gifs);
        inputSlideDuration.value = config.slideDuration || 3;
        inputPageTitle.value = config.pageTitle || '';
        adminModal.classList.remove('hidden');
    }

    closeAdminBtn.addEventListener('click', () => adminModal.classList.add('hidden'));

    document.addEventListener('keydown', e => {
        if (e.shiftKey && e.key.toLowerCase() === 'a') openAdminModal();
    });

    window.addEventListener('hashchange', () => {
        if (location.hash === '#admin') openAdminModal();
    });
    if (location.hash === '#admin') openAdminModal();

    configForm.addEventListener('submit', e => {
        e.preventDefault();

        const defaultUrl = inputTargetUrl.value.trim() || "https://s.shopee.com.my/5q8YfpcrjR";
        const rawImages = linesToObjects(inputImages.value, defaultUrl);

        if (!rawImages.length) {
            alert('Sila masukkan sekurang-kurangnya satu gambar slideshow!');
            return;
        }

        config = {
            targetUrl: defaultUrl,
            pageTitle: inputPageTitle.value.trim(),
            slideDuration: parseInt(inputSlideDuration.value, 10) || 3,
            images: rawImages,
            previewImages: linesToObjects(inputPreviewImages.value, defaultUrl),
            page8Gifs: linesToObjects(inputPage8Gifs.value, defaultUrl)
        };

        localStorage.setItem('site_config', JSON.stringify(config));
        adminModal.classList.add('hidden');
        initPublicPage();
        alert('Tetapan berjaya disimpan!');
    });

    resetDefaultBtn.addEventListener('click', () => {
        if (confirm('Adakah anda pasti mahu mereset semua tetapan?')) {
            localStorage.removeItem('site_config');
            config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            openAdminModal();
            initPublicPage();
        }
    });

    mainImageClick.addEventListener('click', () => goToLink(currentMainUrl));

    document.addEventListener('contextmenu', e => {
        if (e.target.tagName === 'IMG' || e.target.closest('img')) e.preventDefault();
    });
    document.addEventListener('dragstart', e => {
        if (e.target.tagName === 'IMG' || e.target.closest('img')) e.preventDefault();
    });

    protectImage(imgElement);
    initPublicPage();
</script>

</body>
</html>
